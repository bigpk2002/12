name: Daily Gold Report

on:
  schedule:
    # cron ใช้เวลา UTC เสมอ — ประเทศไทยคือ UTC+7
    # 01:45 UTC = 08:45 เวลาไทย (ตั้งเผื่อ buffer ~15 นาทีก่อน 9 โมง กันดีเลย์ของแผนฟรี)
    - cron: "45 1 * * *"
  workflow_dispatch: {}   # ปุ่มให้กด Run เองได้จาก Actions tab เวลาอยากทดสอบ

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gold report
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python report.py

      - name: Keep-alive commit (prevents GitHub disabling schedule after 60 days idle)
        run: |
          git config user.name "gold-report-bot"
          git config user.email "actions@users.noreply.github.com"
          date -u +"%Y-%m-%d %H:%M UTC" > .last_run
          git add .last_run
          git diff --staged --quiet || git commit -m "chore: keep-alive $(date -u +%F)"
          git push
